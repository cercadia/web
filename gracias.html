<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Gracias — Cercadia</title>
<link rel="alternate" hreflang="es" href="https://cercadia.com/gracias.html">
<link rel="alternate" hreflang="ca" href="https://cercadia.com/ca/gracias.html">
<link rel="alternate" hreflang="x-default" href="https://cercadia.com/gracias.html">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1F4E79; --cream:#F7F4EF; --terracotta:#D98C56; --ink:#2B2B2B; --muted:#6B6B6B; --line:#E4DFD5; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; color:var(--ink); background:var(--cream); min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; }
  .box { max-width:520px; padding:40px 24px; }
  .logo { font-family:'Fraunces',serif; font-weight:700; font-size:22px; color:var(--navy); margin-bottom:24px; display:block; }
  h1 { font-family:'Fraunces',serif; color:var(--navy); font-size:30px; margin-bottom:14px; }
  p { font-size:17px; color:var(--muted); margin-bottom:28px; }
  a.btn { display:inline-block; background:var(--terracotta); color:#fff; font-weight:700; padding:12px 28px; border-radius:30px; text-decoration:none; }
</style>
</head>
<body>
  <div class="box">
    <a class="logo" href="/">Cercadia</a>
    <h1>Gracias por escribirnos</h1>
    <p>Hemos recibido tu mensaje. Te respondemos en menos de 48 horas.</p>
    <a class="btn" href="/">Volver a la web</a>
  </div>
</body>
</html>
